server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /proxy/api-health {
        proxy_pass http://api:8000/health;
        proxy_read_timeout 5s;
    }

    location = /proxy/api-categories {
        proxy_pass http://api:8000/categories;
        proxy_read_timeout 5s;
    }

    location = /proxy/results {
        proxy_pass http://api:8000/results;
        proxy_read_timeout 10s;
    }

    location = /proxy/chat {
        proxy_pass http://n8n:5678/webhook/prismatic-rag-chat;
        proxy_read_timeout 30s;
    }

    location = /proxy/n8n-health {
        proxy_pass http://n8n:5678/healthz;
        proxy_read_timeout 5s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
