[project]
name = "prismatic-api"
version = "0.1.0"
description = "FastAPI backend for the prismatic document analyst system"
requires-python = ">=3.10,<3.14"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "python-dotenv==1.0.1",
    "supabase==2.4.6",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]
